<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Color Palette Generator</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <h1>Color Palette Generator</h1>
  <p class="subtitle">Generate a random palette, then click any swatch to copy its hex code.</p>

  <button id="generate-btn">Generate New Palette</button>
  <p class="hint">Tip: press the spacebar to generate too.</p>

  <div id="palette" aria-live="polite"></div>
  <div id="toast" role="status"></div>

  <script src="script.js"></script>
</body>
</html>
